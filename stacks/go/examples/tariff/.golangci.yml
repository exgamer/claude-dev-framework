# Механические правила эталона: каждое правило ниже — отражение правила памятки,
# включено только после проверки, что ловит заведомое нарушение и не шумит на эталоне.
# Собран tools/lint/lint.py фреймворка (lint.py go <проект> --render); правка — в генераторе, не здесь.
version: "2"

run:
  tests: true
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - depguard # слои и границы доменов
    - errcheck # ошибка не игнорируется, в т. ч. через _
    - forbidigo # запрещённые вызовы
    - nlreturn # пустая строка перед return/continue/break
    - revive # ctx первым, ID в именах
  settings:
    depguard:
      rules:
        domain-no-infra:
          files:
            - "**/internal/domains/**"
            - "!$test" # правило — о коде пакета, тесты памятка не ограничивает
          deny:
            - pkg: "example.com/parking-service/internal/infrastructure"
              desc: "домен не знает инфраструктуру — порт в домене, адаптер в infrastructure"
            - pkg: "example.com/parking-service/internal/entrypoints"
              desc: "домен не знает точки входа"
            - pkg: "example.com/parking-service/internal/workflows"
              desc: "домен не вызывает workflow"
            - pkg: "example.com/parking-service/internal/app"
              desc: "домен не знает сборку"
            - pkg: "gorm.io"
              desc: "домен без ORM — модель и запросы в infrastructure"
            - pkg: "github.com/gin-gonic"
              desc: "домен без HTTP"
            - pkg: "net/http"
              desc: "домен без HTTP"
        # Домены проекта не импортируют друг друга — по правилу на каждый домен (список доменов — internal/domains/*)
        billing-no-other-domains:
          files:
            - "**/internal/domains/billing/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/domains/handbook"
              desc: "чужой домен — через workflow или internal/common"
            - pkg: "example.com/parking-service/internal/domains/identity"
              desc: "чужой домен — через workflow или internal/common"
        handbook-no-other-domains:
          files:
            - "**/internal/domains/handbook/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/domains/billing"
              desc: "чужой домен — через workflow или internal/common"
            - pkg: "example.com/parking-service/internal/domains/identity"
              desc: "чужой домен — через workflow или internal/common"
        identity-no-other-domains:
          files:
            - "**/internal/domains/identity/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/domains/billing"
              desc: "чужой домен — через workflow или internal/common"
            - pkg: "example.com/parking-service/internal/domains/handbook"
              desc: "чужой домен — через workflow или internal/common"
        billing-outbox-tariff-event-no-other-modules:
          files:
            - "**/internal/domains/billing/outbox_tariff_event/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/domains/billing/tariff$"
              desc: "соседний модуль домена billing — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/billing/common"
            - pkg: "example.com/parking-service/internal/domains/billing/tariff/"
              desc: "соседний модуль домена billing — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/billing/common"
        billing-tariff-no-other-modules:
          files:
            - "**/internal/domains/billing/tariff/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/domains/billing/outbox_tariff_event$"
              desc: "соседний модуль домена billing — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/billing/common"
            - pkg: "example.com/parking-service/internal/domains/billing/outbox_tariff_event/"
              desc: "соседний модуль домена billing — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/billing/common"
        identity-admin-no-other-modules:
          files:
            - "**/internal/domains/identity/admin/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/domains/identity/partner$"
              desc: "соседний модуль домена identity — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/identity/common"
            - pkg: "example.com/parking-service/internal/domains/identity/partner/"
              desc: "соседний модуль домена identity — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/identity/common"
        identity-partner-no-other-modules:
          files:
            - "**/internal/domains/identity/partner/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/domains/identity/admin$"
              desc: "соседний модуль домена identity — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/identity/common"
            - pkg: "example.com/parking-service/internal/domains/identity/admin/"
              desc: "соседний модуль домена identity — связь через интерфейс модуля-потребителя (O-6, modules.go), общее — internal/domains/identity/common"
        workflow-no-workflow:
          files:
            - "**/internal/workflows/**"
            - "!$test" # внешний тест workflow импортирует сам workflow
          deny:
            - pkg: "example.com/parking-service/internal/workflows"
              desc: "workflow не вызывает другой workflow"
            - pkg: "example.com/parking-service/internal/infrastructure"
              desc: "workflow берёт интерфейсы доменов, не инфраструктуру"
        entrypoint-no-infra:
          files:
            - "**/internal/entrypoints/**"
            - "!$test"
          deny:
            - pkg: "example.com/parking-service/internal/infrastructure"
              desc: "точка входа — через сервис/workflow, инфраструктура собирается в bootstrap"
            - pkg: "example.com/parking-service/internal/app"
              desc: "точка входа не знает сборку"
        common-no-internal:
          files:
            - "**/internal/common/**"
            - "!$test" # внешний тестовый пакет импортирует сам common
          deny:
            - pkg: "example.com/parking-service/internal/domains"
              desc: "internal/common — общий словарь без зависимостей от слоёв"
            - pkg: "example.com/parking-service/internal/infrastructure"
              desc: "internal/common — общий словарь без зависимостей от слоёв"
            - pkg: "example.com/parking-service/internal/entrypoints"
              desc: "internal/common — общий словарь без зависимостей от слоёв"
            - pkg: "example.com/parking-service/internal/workflows"
              desc: "internal/common — общий словарь без зависимостей от слоёв"
            - pkg: "example.com/parking-service/internal/app"
              desc: "internal/common — общий словарь без зависимостей от слоёв"
        pkg-no-internal:
          files:
            - "**/pkg/**"
          deny:
            - pkg: "example.com/parking-service/internal"
              desc: "pkg/ — код без домена: internal/** (в т. ч. internal/common) не импортирует; нужен доменный тип — код в слое домена"
    errcheck:
      check-blank: true # `_ =` и `v, _ :=` для ошибки — тоже потеря (checklist.md п. 20)
      # CaptureSoft/CaptureError возвращают ту же, уже отправленную в трекер ошибку — вызов отдельной строкой (conventions.md п. 8, 19)
      exclude-functions:
        - git.mpinnovations.kz/mps/go-packages/gosdk-core/pkg/errorreporter.CaptureSoft
        - git.mpinnovations.kz/mps/go-packages/gosdk-core/pkg/errorreporter.CaptureError
        - github.com/exgamer/gosdk-core/pkg/errorreporter.CaptureSoft
        - github.com/exgamer/gosdk-core/pkg/errorreporter.CaptureError
    forbidigo:
      forbid:
        - pattern: '^context\.(Background|TODO)$'
          msg: "в бизнес-коде ctx приходит параметром; Background — только в main/console/тестах"
      analyze-types: false
    nlreturn:
      block-size: 1
    revive:
      rules:
        - name: context-as-argument
        - name: var-naming
  exclusions:
    # std-error-handling: ошибка Close/Flush/os.Remove/печати не проверяется errcheck — отложенное закрытие после чтения
    # (conventions.md п. 8); закрытие после записи (файл, буферизованный writer) проверяет ревьюер
    presets: [std-error-handling]
    rules:
      # main, cmd/, console, app — точки запуска: корневой ctx создаётся здесь (conventions.md п. 1)
      - path: '(^|/)(main\.go|cmd/|internal/console/|internal/app/)'
        linters: [forbidigo]
      # тесты создают свой ctx — правило о бизнес-коде (conventions.md п. 1)
      - path: '_test\.go$'
        linters: [forbidigo]
      # ctx — правило бизнес-кода (conventions.md п. 1): pkg/ и миграции — не бизнес-код
      - path: '(^|/)(pkg/|internal/migrations/)'
        linters: [forbidigo]
      # код тестов вне _test.go (structure.md): e2e-обвязка tests/ и общие фейки internal/testsupport/
      - path: '(^|/)(tests/|internal/testsupport/)'
        linters: [forbidigo]
      # var-naming — только аббревиатуры (checklist.md п. 34); ALL_CAPS и подчёркивания правило фреймворка не запрещает
      - linters: [revive]
        text: "(don't use ALL_CAPS|don't use an underscore|don't use underscores|should not use underscores)"

formatters:
  enable:
    - gci # импорты тремя группами: std / внешние / свои (checklist.md п. 33)
  settings:
    gci:
      sections: [standard, default, localmodule]
